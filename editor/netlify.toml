[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Node 22+ — supabase-js needs native WebSocket support for
  # admin.createUser() inside Netlify Functions; Node 20 throws
  # "Node.js 20 detected without native WebSocket support" at
  # client construction.
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
