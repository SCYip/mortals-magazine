[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — every route falls through to index.html so React Router can handle it
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

# Cache hashed assets aggressively; leave HTML uncached so deploys roll out immediately
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
